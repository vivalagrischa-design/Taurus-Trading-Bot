name: TAURUS V7 safety tests
on:
  push:
    branches: [feature/v7-lucid-25k-simulator]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: V7 simulator and risk tests
        run: |
          python -m unittest -v test_lucid_25k_sim test_v7_session_policy
          python -m unittest discover -s tests -p 'test_*.py' -v
