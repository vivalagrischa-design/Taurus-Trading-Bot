name: TAURUS V7 safety tests
on:
  push:
    branches: [feature/v7-lucid-25k-simulator]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: V7 simulator and risk tests
        run: |
          python -m unittest -v test_lucid_25k_sim test_v7_session_policy
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest -v test_lab_lucid_separation test_audit_engulfing_regime test_omar_v2 test_rosi_strategy test_lucid_1m_winners test_daily_archive

      - name: Snapshot current live LAB and Lucid before any deploy
        run: |
          mkdir -p taurus-live-backup
          curl --fail --silent --show-error --retry 3 --max-time 30 'https://taurus-trading-bot.onrender.com/api/paper' -o taurus-live-backup/lab.json
          curl --fail --silent --show-error --retry 3 --max-time 30 'https://taurus-trading-bot.onrender.com/api/lucid' -o taurus-live-backup/lucid.json
          python - <<'PY'
          import json
          lab=json.load(open('taurus-live-backup/lab.json'))
          lucid=json.load(open('taurus-live-backup/lucid.json'))
          assert isinstance(lab.get('trades'),list)
          assert isinstance(lucid.get('trades'),list)
          print('LAB export:',len(lab['trades']),'trades; persistence:',lab.get('persistence'))
          print('Lucid export:',len(lucid['trades']),'trades')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: taurus-live-before-context-logging-and-daily-archive
          path: taurus-live-backup/
          retention-days: 30
