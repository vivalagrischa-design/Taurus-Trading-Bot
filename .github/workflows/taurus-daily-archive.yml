name: TAURUS daily research archive
on:
  schedule:
    # 00:15 UTC = 01:15/02:15 Swiss time, archiving the previous Swiss day.
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Swiss date YYYY-MM-DD (blank = yesterday)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: taurus-daily-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download full LAB and Lucid day snapshot
        env:
          REQUEST_DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          DAY="${REQUEST_DAY:-}"
          if [ -z "$DAY" ]; then DAY="$(date -u -d 'yesterday' +%F)"; fi
          if ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'Invalid YYYY-MM-DD date'; exit 1
          fi
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          export DAY
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 180 \
            "https://taurus-trading-bot.onrender.com/api/archive/day?date=$DAY" \
            -o /tmp/taurus-day.json
          python - <<'PY'
          import json,gzip
          x=json.load(open('/tmp/taurus-day.json'))
          assert x['schema_version']==1 and x['day_swiss']==__import__('os').environ['DAY']
          assert isinstance(x['market_candles'],list) and isinstance(x['strategy_scans'],list)
          print('Daily research archive:',x['day_swiss'],x['counts'],'persistence:',x['persistence'])
          with open('/tmp/taurus-day.json','rb') as src,gzip.open('/tmp/taurus-day.json.gz','wb',compresslevel=9) as dst:
              dst.write(src.read())
          PY
      - name: Commit exactly one compressed JSON file to archive-only branch
        run: |
          set -euo pipefail
          git config user.name 'taurus-archive-bot'
          git config user.email 'taurus-archive-bot@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin taurus-daily-archives >/dev/null; then
            git fetch origin taurus-daily-archives
            git checkout -B taurus-daily-archives origin/taurus-daily-archives
          else
            git checkout --orphan taurus-daily-archives
            git rm -rf . || true
          fi
          YEAR="${DAY:0:4}"
          mkdir -p "scans/$YEAR"
          cp /tmp/taurus-day.json.gz "scans/$YEAR/$DAY.json.gz"
          git add "scans/$YEAR/$DAY.json.gz"
          if git diff --cached --quiet; then
            echo "Archive for $DAY already current."
          else
            git commit -m "Archive TAURUS research $DAY"
            git push origin HEAD:taurus-daily-archives
          fi
