services:
  - type: web
    name: break-retest-paper-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: scanner-signals
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: WEBHOOK_TOKEN
        sync: false
