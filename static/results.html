<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAURUS Resultate</title><style>body{margin:0;background:#0c1420;color:#e8eef7;font:16px system-ui;padding:18px}header,a{color:#c7b5ff}select,button{background:#1a293b;color:#fff;border:1px solid #42536d;border-radius:10px;padding:12px}canvas{width:100%;height:330px;background:#111e2e;border-radius:12px;margin-top:14px}.box{background:#172538;border:1px solid #30425a;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#aab8ca}.pos{color:#38d3a1}.neg{color:#ff7185}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #33445b;text-align:left}</style><header><a href="/">← TAURUS Lab</a> · <a href="/lucid">Lucid</a></header><h1>Strategie-Resultate & Marktbewegung</h1><p class="muted">Markierungen: grün = Gewinntrade, rot = Verlusttrade. Marktphase wird aus den vorangehenden 12 Fünf-Minuten-Kerzen abgeleitet.</p><div class="box"><label>System <select id="sys"><option value="lab">TAURUS Lab</option><option value="lucid">TAURUS Lucid</option></select></label> <label>Strategie <select id="strat"></select></label> <label>Markt <select id="market"><option value="nq">NQ</option><option value="mes">MES</option><option value="mgc">MGC</option></select></label><button id="load">Aktualisieren</button><p id="summary"></p><canvas id="chart" width="1100" height="330"></canvas><div id="stats"></div></div><script>
const $=id=>document.getElementById(id);let data;
function phase(c,i){if(i<12)return'zu wenig Vorgeschichte';let d=c[i].close-c[i-12].close, pct=d/c[i-12].close;return pct>.001?'Aufwärts':pct<-.001?'Abwärts':'Seitwärts'}
async function load(){let sys=$('sys').value,market=$('market').value;let api=sys==='lab'?'/api/paper?market='+market:'/api/lucid';data=await(await fetch(api)).json();let trades=sys==='lab'?data.trades:(data.trades||[]).filter(t=>t.market===market);let names=[...new Set(trades.map(t=>t.strategy))];$('strat').innerHTML=names.map(n=>'<option>'+n+'</option>').join('');if(!names.length)$('strat').innerHTML='<option value="">Keine Trades</option>';let f=await(await fetch('/api/strategies?market='+market)).json();let candles=f.candles_5m||[];draw(candles,trades);show(candles,trades)}
function draw(c,t){let x=$('chart').getContext('2d'),w=1100,h=330;x.clearRect(0,0,w,h);if(!c.length){x.fillStyle='#fff';x.fillText('Keine Kerzen verfügbar',20,30);return}let lo=Math.min(...c.map(b=>b.low)),hi=Math.max(...c.map(b=>b.high)),X=i=>i*w/(c.length-1),Y=p=>h-20-(p-lo)/(hi-lo||1)*(h-40);x.strokeStyle='#78aaff';x.beginPath();c.forEach((b,i)=>i?x.lineTo(X(i),Y(b.close)):x.moveTo(X(i),Y(b.close)));x.stroke();let byTime=new Map(c.map((b,i)=>[Number(b.time),i]));for(let t1 of t){let i=byTime.get(Number(t1.entry_time||t1.signal_time));if(i===undefined)continue;x.fillStyle=(Number(t1.pnl||0)>=0?'#36d6a2':'#ff7084');x.beginPath();x.arc(X(i),Y(c[i].close),5,0,Math.PI*2);x.fill()}}
function show(c,t){let s=$('strat').value,rows=t.filter(z=>z.strategy===s),groups={};for(let z of rows){let i=c.findIndex(b=>Number(b.time)===Number(z.entry_time||z.signal_time));let p=phase(c,i),g=groups[p]||(groups[p]={n:0,w:0,pnl:0});g.n++;if(Number(z.pnl||0)>0)g.w++;g.pnl+=Number(z.pnl||0)}$('summary').textContent=s+' · '+rows.length+' Trades';$('stats').innerHTML='<table><tr><th>Marktphase</th><th>Trades</th><th>Gewinne</th><th>Treffer</th><th>P/L</th></tr>'+Object.entries(groups).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.n+'</td><td>'+v.w+'</td><td>'+Math.round(100*v.w/v.n)+'%</td><td class="'+(v.pnl>=0?'pos':'neg')+'">'+v.pnl.toFixed(2)+' USD</td></tr>').join('')+'</table>'}
$('load').onclick=load;$('sys').onchange=load;$('market').onchange=load;$('strat').onchange=()=>{let sys=$('sys').value;load()};load().catch(e=>$('summary').textContent='Ladefehler: '+e)}
</script></html>
